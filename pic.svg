
<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="541" viewBox="0 0 1270 541">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF9FB"/>
    <stop offset="1" stop-color="#F9E1E9"/>
  </linearGradient>
  <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9B123C"/>
    <stop offset="1" stop-color="#D8527D"/>
  </linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#B93962"/>
    <stop offset="1" stop-color="#F18AAA"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#9B123C" flood-opacity=".12"/>
  </filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .float{animation:float 4s ease-in-out infinite}
    .float2{animation:float 5s ease-in-out 1s infinite}
    .pulse{animation:pulse 2.5s ease-in-out infinite}
    .flow{stroke-dasharray:6 8;animation:flow 12s linear infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
    @keyframes flow{to{stroke-dashoffset:-140}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>

<!-- Background -->
<rect width="1270" height="541" rx="8" fill="url(#bg)"/>
<circle cx="1120" cy="30" r="160" fill="#F5C3D2" opacity=".18"/>
<circle cx="70" cy="480" r="125" fill="#F5C3D2" opacity=".15"/>

<!-- Fine background grid -->
<g stroke="#B93962" stroke-width=".7" opacity=".07">
  <path d="M0 75H1270M0 155H1270M0 235H1270M0 315H1270M0 395H1270M0 475H1270"/>
  <path d="M80 0V541M220 0V541M360 0V541M500 0V541M640 0V541M780 0V541M920 0V541M1060 0V541M1200 0V541"/>
</g>

<!-- Top heading -->
<g transform="translate(65 37)">
  <rect width="42" height="42" rx="12" fill="#9B123C"/>
  <circle cx="21" cy="21" r="13" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".8"/>
  <circle cx="21" cy="21" r="7" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="21" cy="21" r="2.8" fill="#FFFFFF"/>
  <text x="56" y="13" font-size="10" font-weight="bold" letter-spacing="2.5" fill="#B93962">INTELLIGENT MONITORING</text>
  <text x="56" y="39" font-size="25" font-weight="bold" fill="#351321">Risk Alert Classifier</text>
</g>

<text x="1205" y="55" text-anchor="end" font-size="10" font-weight="bold" letter-spacing="2" fill="#B93962">RISK INTELLIGENCE / 01</text>
<text x="1205" y="73" text-anchor="end" font-size="10" fill="#A8798A">DETECT • CLASSIFY • RESPOND</text>

<!-- Left: risk score card -->
<g filter="url(#shadow)">
  <rect x="65" y="112" width="300" height="337" rx="18" fill="#FFFFFF" stroke="#F0C9D6"/>
</g>
<g>
  <text x="87" y="142" font-size="10" font-weight="bold" letter-spacing="1.8" fill="#B93962">LIVE RISK OVERVIEW</text>
  <text x="87" y="166" font-size="18" font-weight="bold" fill="#351321">Risk assessment</text>
  <line x1="87" y1="181" x2="343" y2="181" stroke="#F3E2E8"/>

  <circle cx="215" cy="278" r="69" fill="#FFF7FA" stroke="#F5D6E0" stroke-width="12"/>
  <circle cx="215" cy="278" r="69" fill="none" stroke="url(#rose)" stroke-width="12" stroke-linecap="round" stroke-dasharray="305 434" transform="rotate(-90 215 278)" class="pulse"/>
  <circle cx="215" cy="278" r="49" fill="#FFFFFF"/>
  <text x="215" y="278" text-anchor="middle" font-size="37" font-weight="bold" fill="#9B123C">72</text>
  <text x="215" y="299" text-anchor="middle" font-size="9" font-weight="bold" letter-spacing="1.5" fill="#A8798A">RISK SCORE</text>

  <rect x="87" y="365" width="256" height="52" rx="10" fill="#FFF0F4"/>
  <circle cx="105" cy="391" r="5" fill="#D8527D" class="pulse"/>
  <text x="119" y="387" font-size="12" font-weight="bold" fill="#9B123C">Elevated Risk</text>
  <text x="119" y="403" font-size="10" fill="#815365">Review flagged activity</text>
</g>

<!-- Center: title and classification -->
<g>
  <text x="405" y="147" font-size="11" font-weight="bold" letter-spacing="2.5" fill="#B93962">AI-POWERED ANALYSIS</text>
  <text x="400" y="198" font-size="39" font-weight="bold" fill="#351321">Risk Alert</text>
  <text x="400" y="244" font-size="39" font-weight="bold" fill="#D8527D">Classifier</text>
  <text x="403" y="269" font-size="11" letter-spacing="1.5" fill="#815365">PREDICT • PRIORITIZE • PROTECT</text>
  <line x1="400" y1="284" x2="855" y2="284" stroke="#E9B7C8" stroke-width="1.5"/>
  <line x1="400" y1="284" x2="560" y2="284" stroke="#9B123C" stroke-width="3">
    <animate attributeName="x2" values="400;560;720;400" dur="6s" repeatCount="indefinite"/>
  </line>

  <g transform="translate(400 308)">
    <text x="0" y="0" font-size="11" font-weight="bold" fill="#573042">High risk</text>
    <text x="455" y="0" text-anchor="end" font-size="11" font-weight="bold" fill="#9B123C">72%</text>
    <rect x="0" y="11" width="455" height="9" rx="4.5" fill="#F7E5EB"/>
    <rect x="0" y="11" width="328" height="9" rx="4.5" fill="url(#rose)">
      <animate attributeName="width" values="300;328;300" dur="4s" repeatCount="indefinite"/>
    </rect>

    <text x="0" y="49" font-size="11" font-weight="bold" fill="#573042">Medium risk</text>
    <text x="455" y="49" text-anchor="end" font-size="11" font-weight="bold" fill="#B93962">21%</text>
    <rect x="0" y="60" width="455" height="9" rx="4.5" fill="#F7E5EB"/>
    <rect x="0" y="60" width="96" height="9" rx="4.5" fill="#F18AAA"/>

    <text x="0" y="98" font-size="11" font-weight="bold" fill="#573042">Low risk</text>
    <text x="455" y="98" text-anchor="end" font-size="11" font-weight="bold" fill="#B93962">7%</text>
    <rect x="0" y="109" width="455" height="9" rx="4.5" fill="#F7E5EB"/>
    <rect x="0" y="109" width="32" height="9" rx="4.5" fill="#F9B3C9"/>
  </g>

  <g transform="translate(400 454)">
    <rect width="455" height="34" rx="9" fill="#FFFFFF" stroke="#F0C9D6"/>
    <circle cx="17" cy="17" r="5" fill="#9B123C"/>
    <text x="30" y="21" font-size="10" font-weight="bold" fill="#815365">Classification confidence and risk levels</text>
  </g>
</g>

<!-- Right: alert card -->
<g filter="url(#shadow)">
  <rect x="895" y="112" width="310" height="158" rx="18" fill="#FFFFFF" stroke="#F0C9D6"/>
</g>
<g class="float">
  <text x="918" y="143" font-size="10" font-weight="bold" letter-spacing="1.8" fill="#B93962">SIGNAL DETECTED</text>
  <circle cx="945" cy="190" r="23" fill="#FFF0F4"/>
  <circle cx="945" cy="190" r="15" fill="none" stroke="#D8527D" stroke-width="2"/>
  <circle cx="945" cy="190" r="7" fill="none" stroke="#9B123C" stroke-width="2"/>
  <circle cx="945" cy="190" r="3" fill="#9B123C"/>
  <text x="980" y="185" font-size="16" font-weight="bold" fill="#351321">Anomaly found</text>
  <text x="980" y="205" font-size="11" fill="#815365">Unusual pattern detected</text>
  <rect x="918" y="229" width="264" height="24" rx="7" fill="#FFF0F4"/>
  <text x="1050" y="245" text-anchor="middle" font-size="10" font-weight="bold" fill="#9B123C">REVIEW REQUIRED</text>
</g>

<!-- Right: decision card -->
<g filter="url(#shadow)">
  <rect x="895" y="291" width="310" height="158" rx="18" fill="url(#rose)"/>
</g>
<g class="float2">
  <text x="918" y="322" font-size="10" font-weight="bold" letter-spacing="1.8" fill="#FFE8EF">MODEL DECISION</text>
  <text x="918" y="359" font-size="27" font-weight="bold" fill="#FFFFFF">HIGH RISK</text>
  <text x="918" y="381" font-size="11" fill="#FFE8EF">Confidence threshold exceeded</text>
  <line x1="918" y1="396" x2="1182" y2="396" stroke="#FFFFFF" opacity=".35"/>
  <circle cx="925" cy="419" r="4" fill="#FFFFFF" class="pulse"/>
  <text x="938" y="423" font-size="10" font-weight="bold" fill="#FFFFFF">Automated • Explainable • Actionable</text>
</g>

<!-- Neat connectors -->
<path d="M365 278H383V300H400 M855 190H875V190H895 M855 420H875V370H895" fill="none" stroke="#D8527D" stroke-width="1.8" opacity=".8" class="flow"/>
<circle cx="383" cy="300" r="3.5" fill="#B93962" class="pulse"/>
<circle cx="875" cy="190" r="3.5" fill="#B93962" class="pulse"/>
<circle cx="875" cy="370" r="3.5" fill="#B93962" class="pulse"/>

<!-- Footer -->
<line x1="65" y1="502" x2="1205" y2="502" stroke="#E9B7C8" opacity=".8"/>
<text x="65" y="523" font-size="10" font-weight="bold" letter-spacing="1.8" fill="#9B123C">SMART DETECTION</text>
<text x="635" y="523" text-anchor="middle" font-size="10" fill="#A8798A">DATA → ANALYSIS → CLASSIFICATION → ACTION</text>
<text x="1205" y="523" text-anchor="end" font-size="10" fill="#9B123C">RISK INTELLIGENCE / 01</text>
</svg>
