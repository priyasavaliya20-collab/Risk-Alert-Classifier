
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b123c"/>
      <stop offset="100%" stop-color="#d8527d"/>
    </linearGradient>
    <style>
      text { font-family: Arial, sans-serif; }
      .float { animation: float 3s ease-in-out infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }
      @keyframes pulse {
        0%,100% { opacity:.6; }
        50% { opacity:1; }
      }
    </style>
  </defs>

  <rect width="800" height="450" rx="22" fill="#fff8fb"/>
  <circle cx="740" cy="50" r="110" fill="#f9e1e9"/>

  <rect x="40" y="32" width="38" height="38" rx="12" fill="#9b123c"/>
  <circle cx="59" cy="51" r="11" fill="none" stroke="#fff" stroke-width="2"/>
  <circle cx="59" cy="51" r="4" fill="#fff"/>

  <text x="92" y="45" font-size="12" letter-spacing="3" fill="#b93962">
    INTELLIGENT MONITORING
  </text>
  <text x="92" y="72" font-size="28" font-weight="bold" fill="#351321">
    Risk Alert Classifier
  </text>
  <text x="42" y="104" font-size="13" fill="#815365">
    Detect signals. Classify risk. Act with confidence.
  </text>

  <rect x="40" y="130" width="465" height="260" rx="20"
        fill="#fff" stroke="#f0c9d6"/>

  <text x="65" y="160" font-size="12" font-weight="bold"
        letter-spacing="2" fill="#b93962">LIVE RISK OVERVIEW</text>
  <text x="65" y="187" font-size="19" font-weight="bold"
        fill="#351321">Alert classification</text>

  <circle cx="140" cy="267" r="53" fill="#fff0f4"/>
  <circle cx="140" cy="267" r="43" fill="none"
          stroke="#f5d6e0" stroke-width="10"/>
  <circle cx="140" cy="267" r="43" fill="none"
          stroke="url(#pink)" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="195 270"
          transform="rotate(-90 140 267)">
    <animate attributeName="stroke-dasharray"
             values="160 270;210 270;160 270"
             dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="140" y="274" font-size="29" font-weight="bold"
        text-anchor="middle" fill="#9b123c">72</text>
  <text x="140" y="333" font-size="12" text-anchor="middle"
        fill="#815365">ELEVATED RISK</text>

  <g transform="translate(220 220)">
    <text x="0" y="0" font-size="13" fill="#573042">High risk</text>
    <text x="230" y="0" font-size="13" text-anchor="end"
          font-weight="bold" fill="#9b123c">72%</text>
    <rect y="12" width="230" height="9" rx="4" fill="#f7e5eb"/>
    <rect y="12" width="166" height="9" rx="4" fill="url(#pink)">
      <animate attributeName="width" values="145;166;145"
               dur="3s" repeatCount="indefinite"/>
    </rect>

    <text x="0" y="53" font-size="13" fill="#573042">Medium risk</text>
    <text x="230" y="53" font-size="13" text-anchor="end"
          fill="#b93962">21%</text>
    <rect y="65" width="230" height="9" rx="4" fill="#f7e5eb"/>
    <rect y="65" width="48" height="9" rx="4" fill="#f18aaa"/>

    <text x="0" y="106" font-size="13" fill="#573042">Low risk</text>
    <text x="230" y="106" font-size="13" text-anchor="end"
          fill="#b93962">7%</text>
    <rect y="118" width="230" height="9" rx="4" fill="#f7e5eb"/>
    <rect y="118" width="16" height="9" rx="4" fill="#f9b3c9"/>
  </g>

  <g class="float">
    <rect x="530" y="130" width="230" height="115" rx="18"
          fill="#fff" stroke="#f0c9d6"/>
    <text x="550" y="157" font-size="11" font-weight="bold"
          letter-spacing="1.5" fill="#b93962">SIGNAL DETECTED</text>
    <circle cx="565" cy="198" r="19" fill="#fff0f4"/>
    <circle cx="565" cy="198" r="11" fill="none"
            stroke="#d8527d" stroke-width="2"/>
    <circle cx="565" cy="198" r="4" fill="#9b123c"/>
    <text x="595" y="194" font-size="15" font-weight="bold"
          fill="#351321">Anomaly found</text>
    <text x="595" y="213" font-size="10" fill="#815365">
      Pattern deviation detected
    </text>
  </g>

  <g class="float" style="animation-delay:-1.2s">
    <rect x="530" y="265" width="230" height="125" rx="18"
          fill="url(#pink)"/>
    <text x="550" y="292" font-size="11" letter-spacing="2"
          fill="#ffe8ef">MODEL DECISION</text>
    <text x="550" y="323" font-size="24" font-weight="bold"
          fill="#fff">HIGH RISK</text>
    <text x="550" y="344" font-size="12" fill="#ffe8ef">
      Confidence threshold exceeded
    </text>
    <circle cx="554" cy="367" r="4" fill="#fff" class="pulse"/>
    <text x="566" y="371" font-size="11" fill="#fff">
      Priority alert • Review now
    </text>
  </g>

  <path d="M505 210 H520 M505 325 H520" stroke="#d8527d"
        stroke-width="2" stroke-dasharray="4 5"/>

  <text x="42" y="425" font-size="11" font-weight="bold"
        letter-spacing="2" fill="#9b123c">SMART DETECTION</text>
  <text x="758" y="425" text-anchor="end" font-size="11"
        fill="#a8798a">RISK INTELLIGENCE / 01</text>
</svg>
