```svg
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="500"
     viewBox="0 0 1200 500">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#720D32"/>
      <stop offset="52%" stop-color="#A51D4B"/>
      <stop offset="100%" stop-color="#D94F7A"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#F7A1BB" stop-opacity=".04"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F7A1BB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M35 0H0V35" fill="none"
            stroke="#FFFFFF" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="500" fill="url(#background)"/>
  <rect width="1200" height="500" fill="url(#grid)"/>

  <!-- DECORATIVE SHAPES -->
  <path d="M0 0H16V500H0Z" fill="#F7A1BB"/>
  <path d="M30 0H34V500H30Z" fill="#FFFFFF" opacity=".8"/>
  <circle cx="1060" cy="65" r="130"
          fill="#F7A1BB" opacity=".07"/>
  <circle cx="1100" cy="420" r="170"
          fill="#FFFFFF" opacity=".05"/>

  <!-- LEFT TEXT SECTION -->
  <g font-family="Arial, Helvetica, sans-serif">

    <rect x="78" y="86" width="188" height="32" rx="16"
          fill="#FFFFFF" fill-opacity=".12"
          stroke="#F7A1BB" stroke-opacity=".8"/>

    <circle cx="96" cy="102" r="5" fill="#F7A1BB">
      <animate attributeName="opacity"
               values="1;.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <text x="111" y="107" fill="#FFFFFF"
          font-size="12" font-weight="700"
          letter-spacing="2">INTELLIGENT MONITORING</text>

    <!-- MAIN TITLE -->
    <text x="78" y="192"
          fill="#FFFFFF"
