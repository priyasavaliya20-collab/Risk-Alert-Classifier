               repeatCount="indefinite"/>
    </circle>

    <circle cx="35" cy="65" r="7" fill="#F7A1BB">
      <animate attributeName="r"
               values="5;8;5" dur="1.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="-76" cy="43" r="4" fill="#FFFFFF"/>
  </g>

  <!-- ALERT CALLOUT -->
  <g font-family="Arial, Helvetica, sans-serif">
    <path d="M975 217 L1003 190 H1044"
          fill="none" stroke="#F7A1BB"
          stroke-width="1.5" stroke-linecap="round"/>

    <rect x="1000" y="150" width="94" height="37" rx="9"
          fill="#FFFFFF" fill-opacity=".14"
          stroke="#F7A1BB" stroke-opacity=".8"/>

    <text x="1047" y="173" text-anchor="middle"
          fill="#FFFFFF" font-size="11"
          font-weight="700" letter-spacing="1">RISK ALERT</text>

    <!-- STATUS BAR -->
    <rect x="732" y="379" width="360" height="1"
          fill="#FFFFFF" fill-opacity=".25"/>

    <circle cx="742" cy="402" r="4" fill="#F7A1BB"/>

    <text x="755" y="406" fill="#FFFFFF"
          font-size="12" font-weight="600">SYSTEM ACTIVE</text>

    <text x="1092" y="406" text-anchor="end"
          fill="#F7A1BB" font-size="12"
          font-weight="700">AI / ML</text>
  </g>

  <!-- FLOATING PARTICLES -->
  <g fill="#FFFFFF">
    <circle cx="644" cy="118" r="3" opacity=".7">
      <animate attributeName="cy"
               values="118;103;118" dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="657" cy="383" r="2.5" opacity=".65">
      <animate attributeName="cy"
               values="383;398;383" dur="3.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1138" cy="280" r="3" opacity=".7">
      <animate attributeName="opacity"
               values=".2;.9;.2" dur="2.8s"
               repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- CORNER DETAIL -->
  <path d="M1154 34H1176V56"
        fill="none" stroke="#FFFFFF"
        stroke-opacity=".65" stroke-width="2"/>

  <path d="M1154 466H1176V444"
        fill="none" stroke="#F7A1BB"
        stroke-width="2"/>

</svg>
