

<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="541" viewBox="0 0 1270 541">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFCFD"/>
      <stop offset="1" stop-color="#F9E1E9"/>
    </linearGradient>
    <linearGradient id="rose">
      <stop offset="0" stop-color="#9B123C"/>
      <stop offset="1" stop-color="#D8527D"/>
    </linearGradient>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .title{font-size:28px;font-weight:700;fill:#351321}
      .head{font-size:15px;font-weight:700;fill:#351321}
      .label{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#C52B59}
      .body{font-size:12px;fill:#815365}
      .panel{fill:#fff;stroke:#F5D9E3;stroke-width:1.3}
      .card{opacity:0;animation:appear .8s ease-out forwards}
      .c1{animation-delay:.1s}
      .c2{animation-delay:.3s}
      .c3{animation-delay:.5s}
      .c4{animation-delay:.7s}
      .flow{fill:none;stroke:#D8527D;stroke-width:2;stroke-dasharray:5 5;animation:dash 2s linear infinite}
      .pulse{animation:pulse 2.2s ease-in-out infinite}
      .bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.5s ease-out both}
      .b2{animation-delay:.25s}
      .b3{animation-delay:.5s}
      .b4{animation-delay:.75s}
      .float{animation:float 3s ease-in-out infinite}
      @keyframes appear{
        from{opacity:0;transform:translateY(10px)}
        to{opacity:1;transform:translateY(0)}
      }
      @keyframes dash{to{stroke-dashoffset:-40}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
      @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    </style>
  </defs>

  <rect width="1270" height="541" fill="url(#bg)"/>
  <g opacity=".3" stroke="#F0D1DC">
    <path d="M0 110H1270M0 220H1270M0 330H1270M0 440H1270"/>
    <path d="M250 0V541M500 0V541M750 0V541M1000 0V541"/>
  </g>

  <!-- Header -->
  <rect x="48" y="26" width="47" height="47" rx="12" fill="url(#rose)"/>
  <g transform="translate(71 49)" stroke="#fff" fill="none" stroke-width="2">
    <circle r="9"/>
    <path d="M0 -14V-9M0 9V14M-14 0H-9M9 0H14"/>
    <circle r="3"/>
  </g>
  <text x="110" y="38" class="label">PART F / MACHINE LEARNING</text>
  <text x="110" y="68" class="title">Hyperparameter Tuning</text>
  <text x="48" y="105" class="body">Search • Optimize • Validate • Select</text>
  <text x="1220" y="42" text-anchor="end" class="label">MODEL OPTIMIZATION / 06</text>

  <rect x="48" y="133" width="850" height="360" rx="18" class="panel"/>
  <text x="68" y="161" class="label">TUNING WORKFLOW</text>

  <!-- Stage 1 -->
  <g class="card c1">
    <rect x="62" y="180" width="190" height="294" rx="13" fill="#FFF8FA" stroke="#F5D9E3"/>
    <circle cx="85" cy="207" r="14" fill="#F8D8E3"/>
    <g transform="translate(85 207)" stroke="#9B123C" fill="none" stroke-width="1.7">
      <rect x="-7" y="-7" width="14" height="14" rx="3"/>
      <path d="M-3 -3H3M-3 1H3"/>
    </g>
    <text x="107" y="203" class="label">01 / MODEL</text>
    <text x="78" y="239" class="head">Choose Model</text>

    <rect x="77" y="257" width="160" height="52" rx="8" fill="#FCECF1"/>
    <g transform="translate(98 283)" stroke="#9B123C" fill="none" stroke-width="1.7">
      <circle cy="-7" r="3"/><circle cx="-7" cy="6" r="3"/><circle cx="7" cy="6" r="3"/>
      <path d="M0 -4V0L-7 3M0 0L7 3"/>
    </g>
    <text x="117" y="280" font-size="12" font-weight="700" fill="#351321">Decision Tree</text>
    <text x="117" y="295" class="body">Base estimator</text>

    <rect x="77" y="317" width="160" height="52" rx="8" fill="#FCECF1"/>
    <g transform="translate(98 343)" stroke="#9B123C" fill="none" stroke-width="1.7">
      <path d="M-9 7L-6 -7L-2 7M1 7L4 -6L8 7M-11 9H10"/>
    </g>
    <text x="117" y="340" font-size="12" font-weight="700" fill="#351321">Random Forest</text>
    <text x="117" y="355" class="body">Ensemble model</text>
    <text x="78" y="401" class="body">Define parameters</text>
    <text x="78" y="419" class="body">to improve results</text>
    <rect x="78" y="436" width="117" height="23" rx="11" fill="#F8DDE7"/>
    <text x="136" y="451" text-anchor="middle" font-size="10" font-weight="700" fill="#9B123C">MODEL SETUP</text>
  </g>

  <path d="M254 326H271" class="flow"/>
  <circle cx="263" cy="326" r="9" fill="#D8527D" class="pulse"/>
  <path d="M260 322L265 326L260 330" fill="none" stroke="#fff" stroke-width="1.5"/>

  <!-- Stage 2 -->
  <g class="card c2">
    <rect x="276" y="180" width="190" height="294" rx="13" fill="#FFF8FA" stroke="#F5D9E3"/>
    <circle cx="299" cy="207" r="14" fill="#F8D8E3"/>
    <g transform="translate(299 207)" stroke="#9B123C" fill="none" stroke-width="1.7">
      <circle r="7"/><path d="M5 5L10 10M-3 0H3M0 -3V3"/>
    </g>
    <text x="321" y="203" class="label">02 / SEARCH</text>
    <text x="292" y="239" class="head">Search Methods</text>
    <rect x="291" y="257" width="160" height="68" rx="8" fill="#FCECF1"/>
    <g transform="translate(307 273)" stroke="#9B123C" fill="none" stroke-width="1.5">
      <rect width="16" height="16" rx="2"/>
      <path d="M5 0V16M11 0V16M0 5H16M0 11H16"/>
    </g>
    <text x="333" y="275" font-size="12" font-weight="700" fill="#351321">Grid Search</text>
    <text x="303" y="296" class="body">Tests combinations</text>
    <text x="303" y="311" class="body">systematically</text>
    <rect x="291" y="334" width="160" height="68" rx="8" fill="#FCECF1"/>
    <g transform="translate(315 351)" stroke="#9B123C" fill="none" stroke-width="1.6">
      <circle cx="-5" cy="-4" r="3"/><circle cx="6" cy="-6" r="3"/>
      <circle cx="2" cy="6" r="3"/><circle cx="-8" cy="8" r="2"/>
    </g>
    <text x="333" y="352" font-size="12" font-weight="700" fill="#351321">Random Search</text>
    <text x="303" y="374" class="body">Samples parameter</text>
    <text x="303" y="389" class="body">combinations</text>
    <text x="292" y="444" class="body">Compare search results</text>
  </g>

  <path d="M468 326H485" class="flow"/>
  <circle cx="477" cy="326" r="9" fill="#D8527D" class="pulse"/>
  <path d="M474 322L479 326L474 330" fill="none" stroke="#fff" stroke-width="1.5"/>

  <!-- Stage 3 -->
  <g class="card c3">
    <rect x="490" y="180" width="190" height="294" rx="13" fill="#FFF8FA" stroke="#F5D9E3"/>
    <circle cx="513" cy="207" r="14" fill="#F8D8E3"/>
    <g transform="translate(513 207)" stroke="#9B123C" fill="none" stroke-width="1.7">
      <path d="M-8 -6H8M-8 0H8M-8 6H8"/>
      <circle cx="-2" cy="-6" r="2.5" fill="#fff"/>
      <circle cx="4" cy="0" r="2.5" fill="#fff"/>
      <circle cx="-4" cy="6" r="2.5" fill="#fff"/>
    </g>
    <text x="535" y="203" class="label">03 / TUNE</text>
    <text x="506" y="239" class="head">Adjust Parameters</text>
    <rect x="505" y="257" width="160" height="140" rx="9" fill="#FFF1F6" stroke="#F3D3DE"/>

    <text x="518" y="279" font-size="12" font-weight="700" fill="#351321">max_depth</text>
    <path d="M519 291H649" stroke="#F1C6D5" stroke-width="5" stroke-linecap="round"/>
    <path d="M519 291H595" stroke="url(#rose)" stroke-width="5" stroke-linecap="round" class="bar"/>
    <circle cx="595" cy="291" r="6" fill="#B62250" class="pulse"/>

    <text x="518" y="316" font-size="12" font-weight="700" fill="#351321">n_estimators</text>
    <path d="M519 328H649" stroke="#F1C6D5" stroke-width="5" stroke-linecap="round"/>
    <path d="M519 328H620" stroke="url(#rose)" stroke-width="5" stroke-linecap="round" class="bar b2"/>
    <circle cx="620" cy="328" r="6" fill="#B62250" class="pulse"/>

    <text x="518" y="353" font-size="12" font-weight="700" fill="#351321">learning_rate</text>
    <path d="M519 365H649" stroke="#F1C6D5" stroke-width="5" stroke-linecap="round"/>
    <path d="M519 365H575" stroke="url(#rose)" stroke-width="5" stroke-linecap="round" class="bar b3"/>
    <circle cx="575" cy="365" r="6" fill="#B62250" class="pulse"/>
    <text x="506" y="427" class="body">Optimize settings</text>
    <text x="506" y="447" class="body">Cross-validation</text>
  </g>

  <path d="M682 326H699" class="flow"/>
  <circle cx="691" cy="326" r="9" fill="#D8527D" class="pulse"/>
  <path d="M688 322L693 326L688 330" fill="none" stroke="#fff" stroke-width="1.5"/>

  <!-- Stage 4 -->
  <g class="card c4">
    <rect x="704" y="180" width="180" height="294" rx="13" fill="#FFF8FA" stroke="#F5D9E3"/>
    <circle cx="727" cy="207" r="14" fill="#F8D8E3"/>
    <g transform="translate(727 207)" stroke="#9B123C" fill="none" stroke-width="1.8">
      <path d="M-9 8L-3 1L1 4L9 -7M4 -7H9V-2"/>
    </g>
    <text x="749" y="203" class="label">04 / RESULTS</text>
    <text x="720" y="239" class="head">Best Performance</text>
    <rect x="720" y="257" width="148" height="104" rx="9" fill="#FCECF1"/>
    <text x="733" y="278" class="body">Before tuning</text>
    <rect x="733" y="286" width="122" height="9" rx="4" fill="#F1D0DC"/>
    <rect x="733" y="286" width="89" height="9" rx="4" fill="#E6A0B8" class="bar b2"/>
    <text x="733" y="316" class="body">After tuning</text>
    <rect x="733" y="324" width="122" height="9" rx="4" fill="#F1D0DC"/>
    <rect x="733" y="324" width="109" height="9" rx="4" fill="url(#rose)" class="bar b3"/>
    <text x="733" y="350" font-size="10" fill="#9B123C">Illustrative scores</text>
    <text x="721" y="392" class="body">Compare validation</text>
    <text x="721" y="410" class="body">scores and select</text>
    <text x="721" y="428" class="body">best settings</text>
    <rect x="721" y="440" width="113" height="22" rx="11" fill="#F8DDE7"/>
    <text x="777" y="455" text-anchor="middle" font-size="10" font-weight="700" fill="#9B123C">BEST MODEL</text>
  </g>

  <!-- Insights panel -->
  <rect x="916" y="133" width="306" height="360" rx="18" class="panel card"/>
  <text x="937" y="161" class="label">TUNING INSIGHTS</text>
  <text x="937" y="193" class="title" style="font-size:21px">Performance Gain</text>
  <text x="937" y="216" class="body">Illustrative validation scores</text>

  <text x="937" y="251" class="body">Baseline</text>
  <rect x="1005" y="239" width="174" height="15" rx="7" fill="#F8E4EB"/>
  <rect x="1005" y="239" width="125" height="15" rx="7" fill="#E6A0B8" class="bar"/>
  <text x="1198" y="251" text-anchor="end" font-size="11" font-weight="700" fill="#815365">72%</text>

  <text x="937" y="289" class="body">Tuned</text>
  <rect x="1005" y="277" width="174" height="15" rx="7" fill="#F8E4EB"/>
  <rect x="1005" y="277" width="151" height="15" rx="7" fill="url(#rose)" class="bar b2"/>
  <text x="1198" y="289" text-anchor="end" font-size="11" font-weight="700" fill="#9B123C">87%</text>

  <path d="M937 315H1201" stroke="#F0D1DC"/>
  <text x="937" y="341" class="label">KEY PARAMETERS</text>
  <g font-size="12" fill="#815365">
    <text x="939" y="366">max_depth</text>
    <text x="939" y="390">n_estimators</text>
    <text x="939" y="414">learning_rate</text>
  </g>
  <g fill="#F8D8E3">
    <rect x="1080" y="356" width="112" height="13" rx="6"/>
    <rect x="1080" y="380" width="112" height="13" rx="6"/>
    <rect x="1080" y="404" width="112" height="13" rx="6"/>
  </g>
  <g fill="url(#rose)">
    <rect x="1080" y="356" width="79" height="13" rx="6" class="bar"/>
    <rect x="1080" y="380" width="93" height="13" rx="6" class="bar b2"/>
    <rect x="1080" y="404" width="61" height="13" rx="6" class="bar b3"/>
  </g>

  <rect x="934" y="435" width="270" height="39" rx="10" fill="url(#rose)"/>
  <text x="1069" y="459" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Tune • Validate • Improve</text>

  <!-- Footer -->
  <path d="M48 511H1222" stroke="#E9B8C9"/>
  <text x="48" y="531" class="label">HYPERPARAMETER TUNING</text>
  <text x="635" y="531" text-anchor="middle" class="body">MODEL → SEARCH → TUNE → EVALUATE</text>
  <text x="1222" y="531" text-anchor="end" class="label">PART F / 06</text>
</svg>
