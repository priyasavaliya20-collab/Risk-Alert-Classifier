
<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="541" viewBox="0 0 1270 541">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF9FB"/>
    <stop offset="1" stop-color="#F9E1E9"/>
  </linearGradient>
  <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9B123C"/>
    <stop offset="1" stop-color="#D8527D"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#B93962"/>
    <stop offset="1" stop-color="#F18AAA"/>
  </linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#9B123C" flood-opacity=".09"/>
  </filter>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .float{animation:float 4s ease-in-out infinite}
    .float2{animation:float 5s ease-in-out -2s infinite}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .flow{stroke-dasharray:5 7;animation:flow 5s linear infinite}
    .scan{animation:scan 3.5s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes flow{to{stroke-dashoffset:-120}}
    @keyframes scan{0%{transform:translateY(0);opacity:0}20%{opacity:.8}80%{opacity:.8}100%{transform:translateY(70px);opacity:0}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>

<!-- Background -->
<rect width="1270" height="541" fill="url(#bg)"/>
<circle cx="1190" cy="20" r="145" fill="#F5C3D2" opacity=".23"/>
<circle cx="10" cy="510" r="105" fill="#F5C3D2" opacity=".13"/>
<g stroke="#B93962" stroke-width=".7" opacity=".065">
  <path d="M0 80H1270M0 160H1270M0 240H1270M0 320H1270M0 400H1270M0 480H1270"/>
  <path d="M100 0V541M240 0V541M380 0V541M520 0V541M660 0V541M800 0V541M940 0V541M1080 0V541M1220 0V541"/>
</g>

<!-- Header -->
<g transform="translate(65 27)">
  <rect width="42" height="42" rx="12" fill="#9B123C"/>
  <g transform="translate(10 10)" fill="none" stroke="#FFFFFF" stroke-width="1.7">
    <rect width="22" height="22" rx="3"/>
    <path d="M0 7H22M7 7V22M15 7V22"/>
  </g>
  <text x="56" y="12" font-size="10" font-weight="bold" letter-spacing="2.4" fill="#B93962">PART B / DATA WORKFLOW</text>
  <text x="56" y="40" font-size="26" font-weight="bold" fill="#351321">Dataset Understanding &amp; Preparation</text>
</g>
<text x="1205" y="45" text-anchor="end" font-size="10" font-weight="bold" letter-spacing="2" fill="#B93962">DATA INTELLIGENCE / 02</text>
<text x="1205" y="63" text-anchor="end" font-size="10" fill="#A8798A">INSPECT • CLEAN • PREPARE</text>

<!-- Section label -->
<text x="65" y="107" font-size="11" font-weight="bold" letter-spacing="2" fill="#B93962">FROM RAW DATA TO ANALYSIS-READY DATA</text>
<text x="65" y="129" font-size="12" fill="#815365">Explore structure, discover quality issues and prepare reliable data.</text>

<!-- Main connected workflow panel -->
<rect x="65" y="149" width="820" height="315" rx="19" fill="#FFFFFF" stroke="#F0C9D6" filter="url(#shadow)"/>
<text x="88" y="177" font-size="10" font-weight="bold" letter-spacing="1.7" fill="#B93962">PREPARATION PIPELINE</text>
<text x="861" y="177" text-anchor="end" font-size="10" fill="#A8798A">4 STAGES</text>
<line x1="88" y1="190" x2="862" y2="190" stroke="#F1DCE4"/>

<!-- Stage 1: source -->
<g>
  <rect x="88" y="211" width="170" height="205" rx="13" fill="#FFF9FB" stroke="#EFCAD7"/>
  <rect x="102" y="225" width="33" height="33" rx="9" fill="#F9E1E9"/>
  <g transform="translate(109 232)" stroke="#9B123C" fill="none" stroke-width="1.6">
    <rect width="19" height="19" rx="2"/>
    <path d="M0 6H19M6 6V19M13 6V19"/>
  </g>
  <text x="145" y="237" font-size="9" font-weight="bold" letter-spacing="1" fill="#B93962">01 / SOURCE</text>
  <text x="145" y="252" font-size="13" font-weight="bold" fill="#351321">Raw Dataset</text>

  <g transform="translate(102 275)">
    <rect width="142" height="73" rx="6" fill="#FFFFFF" stroke="#EED5DF"/>
    <path d="M0 20H142M0 38H142M0 56H142M47 0V73M94 0V73" stroke="#EED5DF"/>
    <rect width="142" height="20" rx="5" fill="#F9E1E9"/>
    <g font-size="7.5" font-weight="bold" fill="#9B123C">
      <text x="7" y="13">ID</text><text x="54" y="13">VALUE</text><text x="100" y="13">TYPE</text>
    </g>
    <g fill="#C35A7A" opacity=".75">
      <rect x="7" y="26" width="27" height="4" rx="2"/>
      <rect x="54" y="26" width="28" height="4" rx="2"/>
      <rect x="100" y="26" width="31" height="4" rx="2"/>
      <rect x="7" y="44" width="27" height="4" rx="2"/>
      <rect x="54" y="44" width="22" height="4" rx="2"/>
      <rect x="100" y="44" width="26" height="4" rx="2"/>
      <rect x="7" y="62" width="27" height="4" rx="2"/>
      <rect x="54" y="62" width="31" height="4" rx="2"/>
      <rect x="100" y="62" width="24" height="4" rx="2"/>
    </g>
    <rect width="142" height="7" fill="#F18AAA" opacity=".3" class="scan"/>
  </g>
  <text x="102" y="371" font-size="10" font-weight="bold" fill="#351321">Inspect the structure</text>
  <text x="102" y="390" font-size="10" fill="#815365">Rows, columns, types</text>
  <circle cx="111" cy="403" r="3" fill="#D8527D" class="pulse"/>
  <text x="120" y="407" font-size="9" fill="#B93962">Original input</text>
</g>

<!-- Connector 1 -->
<path d="M258 315H280" stroke="#D8527D" stroke-width="2" class="flow"/>
<path d="M274 310L280 315L274 320" fill="none" stroke="#D8527D" stroke-width="1.5"/>

<!-- Stage 2: profile -->
<g class="float">
  <rect x="282" y="211" width="170" height="205" rx="13" fill="#FFF9FB" stroke="#EFCAD7"/>
  <rect x="296" y="225" width="33" height="33" rx="9" fill="#F9E1E9"/>
  <g transform="translate(303 232)" stroke="#9B123C" fill="none" stroke-width="1.5">
    <path d="M1 20V1M1 20H22"/>
    <rect x="5" y="12" width="4" height="8" fill="#F18AAA" stroke="none"/>
    <rect x="12" y="7" width="4" height="13" fill="#B93962" stroke="none"/>
    <rect x="19" y="3" width="4" height="17" fill="#9B123C" stroke="none"/>
  </g>
  <text x="339" y="237" font-size="9" font-weight="bold" letter-spacing=".8" fill="#B93962">02 / PROFILE</text>
  <text x="339" y="252" font-size="13" font-weight="bold" fill="#351321">Data Quality</text>

  <g transform="translate(296 275)">
    <rect width="142" height="73" rx="6" fill="#FFFFFF" stroke="#EED5DF"/>
    <text x="8" y="15" font-size="8" fill="#815365">Completeness</text>
    <rect x="8" y="21" width="126" height="6" rx="3" fill="#F7E5EB"/>
    <rect x="8" y="21" width="96" height="6" rx="3" fill="#D8527D">
      <animate attributeName="width" values="85;104;85" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="8" y="42" font-size="8" fill="#815365">Consistency</text>
    <rect x="8" y="48" width="126" height="6" rx="3" fill="#F7E5EB"/>
    <rect x="8" y="48" width="78" height="6" rx="3" fill="#B93962"/>
    <circle cx="128" cy="12" r="3" fill="#D8527D" class="pulse"/>
    <text x="8" y="66" font-size="8" fill="#815365">Missing values • Duplicates</text>
  </g>
  <text x="296" y="371" font-size="10" font-weight="bold" fill="#351321">Find quality issues</text>
  <text x="296" y="390" font-size="10" fill="#815365">Profile &amp; validate</text>
  <circle cx="305" cy="403" r="3" fill="#D8527D" class="pulse"/>
  <text x="314" y="407" font-size="9" fill="#B93962">Quality check</text>
</g>

<!-- Connector 2 -->
<path d="M452 315H474" stroke="#D8527D" stroke-width="2" class="flow"/>
<path d="M468 310L474 315L468 320" fill="none" stroke="#D8527D" stroke-width="1.5"/>

<!-- Stage 3: cleaning -->
<g>
  <rect x="476" y="211" width="170" height="205" rx="13" fill="#FFF9FB" stroke="#EFCAD7"/>
  <rect x="490" y="225" width="33" height="33" rx="9" fill="#F9E1E9"/>
  <g transform="translate(498 232)" fill="none" stroke="#9B123C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 4H19M6 4V1H14V4M4 7L5 21H15L16 7M8 10V18M12 10V18"/>
  </g>
  <text x="533" y="237" font-size="9" font-weight="bold" letter-spacing=".8" fill="#B93962">03 / CLEAN</text>
  <text x="533" y="252" font-size="13" font-weight="bold" fill="#351321">Data Cleaning</text>

  <g transform="translate(490 275)">
    <rect width="142" height="73" rx="6" fill="#FFFFFF" stroke="#EED5DF"/>
    <text x="8" y="13" font-size="8" font-weight="bold" fill="#815365">RAW</text>
    <text x="81" y="13" font-size="8" font-weight="bold" fill="#815365">CLEAN</text>
    <rect x="8" y="20" width="54" height="45" rx="4" fill="#F9E1E9"/>
    <rect x="80" y="20" width="54" height="45" rx="4" fill="#F9E1E9"/>
    <g fill="#B93962">
      <rect x="13" y="26" width="44" height="7" rx="2"/>
      <rect x="13" y="37" width="44" height="7" rx="2"/>
      <rect x="13" y="48" width="44" height="7" rx="2"/>
      <rect x="13" y="57" width="44" height="4" rx="2" opacity=".4"/>
      <rect x="85" y="26" width="44" height="7" rx="2"/>
      <rect x="85" y="37" width="44" height="7" rx="2"/>
      <rect x="85" y="48" width="44" height="7" rx="2"/>
    </g>
    <path d="M64 42H76M71 37L76 42L71 47" fill="none" stroke="#D8527D" stroke-width="1.5" class="flow"/>
    <circle cx="127" cy="25" r="5" fill="#9B123C"/>
    <path d="M124 25L126 27L130 22" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  </g>
  <text x="490" y="371" font-size="10" font-weight="bold" fill="#351321">Fix inconsistencies</text>
  <text x="490" y="390" font-size="10" fill="#815365">Duplicates &amp; missing data</text>
  <circle cx="499" cy="403" r="3" fill="#D8527D" class="pulse"/>
  <text x="508" y="407" font-size="9" fill="#B93962">Clean records</text>
</g>

<!-- Connector 3 -->
<path d="M646 315H668" stroke="#D8527D" stroke-width="2" class="flow"/>
<path d="M662 310L668 315L662 320" fill="none" stroke="#D8527D" stroke-width="1.5"/>

<!-- Stage 4: ready -->
<g class="float2">
  <rect x="670" y="211" width="190" height="205" rx="13" fill="#FFF9FB" stroke="#EFCAD7"/>
  <rect x="684" y="225" width="33" height="33" rx="9" fill="#F9E1E9"/>
  <path d="M692 242L698 248L709 235" fill="none" stroke="#9B123C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="727" y="237" font-size="9" font-weight="bold" letter-spacing=".7" fill="#B93962">04 / OUTPUT</text>
  <text x="727" y="252" font-size="13" font-weight="bold" fill="#351321">Prepared Data</text>

  <rect x="684" y="275" width="162" height="73" rx="8" fill="#FFFFFF" stroke="#EED5DF"/>
  <circle cx="715" cy="311" r="22" fill="#FFF0F4"/>
  <circle cx="715" cy="311" r="15" fill="none" stroke="#F1C8D7" stroke-width="2"/>
  <circle cx="715" cy="311" r="10" fill="url(#rose)" class="pulse"/>
  <path d="M710 311L714 315L721 307" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="746" y="307" font-size="11" font-weight="bold" fill="#9B123C">DATA READY</text>
  <text x="746" y="324" font-size="9" fill="#815365">Validated</text>
  <text x="684" y="371" font-size="10" font-weight="bold" fill="#351321">Ready for analysis</text>
  <text x="684" y="390" font-size="10" fill="#815365">Structured &amp; reliable</text>
  <circle cx="693" cy="403" r="3" fill="#D8527D" class="pulse"/>
  <text x="702" y="407" font-size="9" fill="#B93962">Final dataset</text>
</g>

<!-- Quality summary panel -->
<rect x="905" y="149" width="300" height="315" rx="19" fill="#FFFFFF" stroke="#F0C9D6" filter="url(#shadow)"/>
<text x="929" y="179" font-size="10" font-weight="bold" letter-spacing="1.7" fill="#B93962">DATA QUALITY CONTROL</text>
<text x="929" y="204" font-size="18" font-weight="bold" fill="#351321">Preparation checklist</text>
<line x1="929" y1="217" x2="1181" y2="217" stroke="#F1DCE4"/>

<g>
  <circle cx="941" cy="245" r="10" fill="#FFF0F4"/>
  <path d="M936 245L940 249L946 241" fill="none" stroke="#9B123C" stroke-width="1.7"/>
  <text x="960" y="249" font-size="11" fill="#573042">Column types checked</text>
  <line x1="929" y1="266" x2="1181" y2="266" stroke="#F5E8ED"/>

  <circle cx="941" cy="288" r="10" fill="#FFF0F4"/>
  <path d="M936 288L940 292L946 284" fill="none" stroke="#9B123C" stroke-width="1.7"/>
  <text x="960" y="292" font-size="11" fill="#573042">Missing values reviewed</text>
  <line x1="929" y1="309" x2="1181" y2="309" stroke="#F5E8ED"/>

  <circle cx="941" cy="331" r="10" fill="#FFF0F4"/>
  <path d="M936 331L940 335L946 327" fill="none" stroke="#9B123C" stroke-width="1.7"/>
  <text x="960" y="335" font-size="11" fill="#573042">Duplicate records checked</text>
  <line x1="929" y1="352" x2="1181" y2="352" stroke="#F5E8ED"/>

  <circle cx="941" cy="374" r="10" fill="#FFF0F4"/>
  <path d="M936 374L940 378L946 370" fill="none" stroke="#9B123C" stroke-width="1.7"/>
  <text x="960" y="378" font-size="11" fill="#573042">Dataset validated</text>
</g>

<rect x="929" y="400" width="252" height="43" rx="10" fill="url(#rose)"/>
<circle cx="948" cy="421" r="5" fill="#FFFFFF" class="pulse"/>
<text x="962" y="417" font-size="10" font-weight="bold" fill="#FFFFFF">READY FOR ANALYSIS</text>
<text x="962" y="431" font-size="9" fill="#FFE8EF">Reliable • Structured • Usable</text>

<!-- Footer -->
<line x1="65" y1="489" x2="1205" y2="489" stroke="#E9B7C8" opacity=".8"/>
<text x="65" y="514" font-size="10" font-weight="bold" letter-spacing="1.8" fill="#9B123C">DATA PREPARATION</text>
<text x="635" y="514" text-anchor="middle" font-size="10" fill="#A8798A">UNDERSTAND → PROFILE → CLEAN → PREPARE</text>
<text x="1205" y="514" text-anchor="end" font-size="10" fill="#9B123C">PART B / 02</text>
</svg>
