
<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="541" viewBox="0 0 1270 541">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF9FB"/>
    <stop offset="1" stop-color="#F9E1E9"/>
  </linearGradient>
  <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9B123C"/>
    <stop offset="1" stop-color="#D8527D"/>
  </linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#B93962"/>
    <stop offset="1" stop-color="#F18AAA"/>
  </linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#9B123C" flood-opacity=".10"/>
  </filter>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .float{animation:float 4s ease-in-out infinite}
    .float2{animation:float 5s ease-in-out -2s infinite}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .flow{stroke-dasharray:5 7;animation:flow 5s linear infinite}
    .bar{animation:bar 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes flow{to{stroke-dashoffset:-120}}
    @keyframes bar{0%,100%{transform:scaleX(.94)}50%{transform:scaleX(1)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>

<!-- Background -->
<rect width="1270" height="541" fill="url(#bg)"/>
<circle cx="1190" cy="15" r="145" fill="#F5C3D2" opacity=".23"/>
<circle cx="10" cy="510" r="105" fill="#F5C3D2" opacity=".13"/>
<g stroke="#B93962" stroke-width=".7" opacity=".065">
  <path d="M0 80H1270M0 160H1270M0 240H1270M0 320H1270M0 400H1270M0 480H1270"/>
  <path d="M100 0V541M240 0V541M380 0V541M520 0V541M660 0V541M800 0V541M940 0V541M1080 0V541M1220 0V541"/>
</g>

<!-- Header -->
<g transform="translate(65 27)">
  <rect width="42" height="42" rx="12" fill="#9B123C"/>
  <g transform="translate(10 10)" fill="none" stroke="#FFFFFF" stroke-width="1.7">
    <rect width="22" height="22" rx="3"/>
    <path d="M0 7H22M7 7V22M15 7V22"/>
  </g>
  <text x="56" y="12" font-size="10" font-weight="bold" letter-spacing="2.4" fill="#B93962">PART C / MACHINE LEARNING</text>
  <text x="56" y="40" font-size="26" font-weight="bold" fill="#351321">Baseline Classification Model</text>
</g>
<text x="1205" y="45" text-anchor="end" font-size="10" font-weight="bold" letter-spacing="2" fill="#B93962">MODEL INTELLIGENCE / 03</text>
<text x="1205" y="63" text-anchor="end" font-size="10" fill="#A8798A">TRAIN • PREDICT • EVALUATE</text>

<text x="65" y="107" font-size="11" font-weight="bold" letter-spacing="2" fill="#B93962">FROM TRAINING DATA TO CLASSIFICATION RESULTS</text>
<text x="65" y="129" font-size="12" fill="#815365">Build a baseline model, predict classes and measure performance.</text>

<!-- Main model workflow panel -->
<rect x="65" y="149" width="820" height="315" rx="19" fill="#FFFFFF" stroke="#F0C9D6" filter="url(#shadow)"/>
<text x="88" y="177" font-size="10" font-weight="bold" letter-spacing="1.7" fill="#B93962">CLASSIFICATION PIPELINE</text>
<text x="861" y="177" text-anchor="end" font-size="10" fill="#A8798A">4 STAGES</text>
<line x1="88" y1="190" x2="862" y2="190" stroke="#F1DCE4"/>

<!-- Stage 1: training data -->
<g>
  <rect x="88" y="211" width="170" height="205" rx="13" fill="#FFF9FB" stroke="#EFCAD7"/>
  <rect x="102" y="225" width="33" height="33" rx="9" fill="#F9E1E9"/>
  <g transform="translate(109 232)" fill="none" stroke="#9B123C" stroke-width="1.6">
    <rect width="19" height="19" rx="2"/>
    <path d="M0 6H19M6 6V19M13 6V19"/>
  </g>
  <text x="145" y="237" font-size="9" font-weight="bold" letter-spacing=".8" fill="#B93962">01 / INPUT</text>
  <text x="145" y="252" font-size="13" font-weight="bold" fill="#351321">Dataset Split</text>

  <g transform="translate(102 275)">
    <rect width="142" height="73" rx="7" fill="#FFFFFF" stroke="#EED5DF"/>
    <text x="8" y="15" font-size="9" font-weight="bold" fill="#9B123C">TRAIN / TEST</text>
    <rect x="8" y="24" width="126" height="15" rx="4" fill="#F7E5EB"/>
    <rect x="8" y="24" width="100" height="15" rx="4" fill="url(#rose)"/>
    <rect x="108" y="24" width="26" height="15" rx="4" fill="#F18AAA"/>
    <text x="8" y="54" font-size="9" fill="#815365">Training</text>
    <text x="134" y="54" text-anchor="end" font-size="9" fill="#815365">Testing</text>
    <circle cx="128" cy="13" r="3" fill="#D8527D" class="pulse"/>
  </g>
  <text x="102" y="371" font-size="10" font-weight="bold" fill="#351321">Prepare features</text>
  <text x="102" y="390" font-size="10" fill="#815365">Inputs &amp; target labels</text>
  <circle cx="111" cy="403" r="3" fill="#D8527D" class="pulse"/>
  <text x="120" y="407" font-size="9" fill="#B93962">Train / test split</text>
</g>

<!-- Connector -->
<path d="M258 315H280" stroke="#D8527D" stroke-width="2" class="flow"/>
<path d="M274 310L280 315L274 320" fill="none" stroke="#D8527D" stroke-width="1.5"/>

<!-- Stage 2: model -->
<g class="float">
  <rect x="282" y="211" width="170" height="205" rx="13" fill="#FFF9FB" stroke="#EFCAD7"/>
  <rect x="296" y="225" width="33" height="33" rx="9" fill="#F9E1E9"/>
  <g transform="translate(301 231)" fill="none" stroke="#9B123C" stroke-width="1.5">
    <circle cx="12" cy="4" r="3.5"/>
    <circle cx="4" cy="19" r="3.5"/>
    <circle cx="20" cy="19" r="3.5"/>
    <path d="M10 7L5 15M14 7L19 15M8 19H16"/>
  </g>
  <text x="339" y="237" font-size="9" font-weight="bold" letter-spacing=".8" fill="#B93962">02 / TRAIN</text>
  <text x="339" y="252" font-size="13" font-weight="bold" fill="#351321">Baseline Model</text>

  <g transform="translate(296 275)">
    <rect width="142" height="73" rx="7" fill="#FFFFFF" stroke="#EED5DF"/>
    <g stroke="#D8527D" stroke-width="1.5" fill="none">
      <path d="M71 20L42 37M71 20L100 37M42 37L26 55M42 37L57 55M100 37L85 55M100 37L116 55"/>
    </g>
    <g fill="#F9E1E9" stroke="#B93962" stroke-width="1.2">
      <circle cx="71" cy="17" r="9"/>
      <circle cx="42" cy="37" r="7"/>
      <circle cx="100" cy="37" r="7"/>
      <circle cx="26" cy="55" r="5"/>
      <circle cx="57" cy="55" r="5"/>
      <circle cx="85" cy="55" r="5"/>
      <circle cx="116" cy="55" r="5"/>
    </g>
    <circle cx="71" cy="17" r="3" fill="#9B123C"/>
    <circle cx="42" cy="37" r="2.5" fill="#D8527D" class="pulse"/>
    <circle cx="100" cy="37" r="2.5" fill="#D8527D" class="pulse"/>
  </g>
  <text x="296" y="371" font-size="10" font-weight="bold" fill="#351321">Learn class patterns</text>
  <text x="296" y="390" font-size="10" fill="#815365">Fit a simple classifier</text>
  <circle cx="305" cy="403" r="3" fill="#D8527D" class="pulse"/>
  <text x="314" y="407" font-size="9" fill="#B93962">Model training</text>
</g>

<!-- Connector -->
<path d="M452 315H474" stroke="#D8527D" stroke-width="2" class="flow"/>
<path d="M468 310L474 315L468 320" fill="none" stroke="#D8527D" stroke-width="1.5"/>

<!-- Stage 3: prediction -->
<g>
  <rect x="476" y="211" width="170" height="205" rx="13" fill="#FFF9FB" stroke="#EFCAD7"/>
  <rect x="490" y="225" width="33" height="33" rx="9" fill="#F9E1E9"/>
  <g transform="translate(497 232)" fill="none" stroke="#9B123C" stroke-width="1.6" stroke-linecap="round">
    <circle cx="11" cy="11" r="9"/>
    <path d="M11 6V11L15 14"/>
  </g>
  <text x="533" y="237" font-size="9" font-weight="bold" letter-spacing=".8" fill="#B93962">03 / PREDICT</text>
  <text x="533" y="252" font-size="13" font-weight="bold" fill="#351321">Class Prediction</text>

  <g transform="translate(490 275)">
    <rect width="142" height="73" rx="7" fill="#FFFFFF" stroke="#EED5DF"/>
    <text x="8" y="15" font-size="9" font-weight="bold" fill="#815365">PREDICTED CLASS</text>
    <rect x="8" y="23" width="126" height="18" rx="5" fill="#F9E1E9"/>
    <circle cx="18" cy="32" r="4" fill="#9B123C"/>
    <text x="28" y="35" font-size="9" font-weight="bold" fill="#9B123C">Class A</text>
    <rect x="8" y="47" width="126" height="18" rx="5" fill="#FFF0F4"/>
    <circle cx="18" cy="56" r="4" fill="#F18AAA"/>
    <text x="28" y="59" font-size="9" fill="#815365">Class B</text>
    <path d="M119 30L123 34L130 26" fill="none" stroke="#9B123C" stroke-width="1.5" class="pulse"/>
  </g>
  <text x="490" y="371" font-size="10" font-weight="bold" fill="#351321">Classify new samples</text>
  <text x="490" y="390" font-size="10" fill="#815365">Generate predictions</text>
  <circle cx="499" cy="403" r="3" fill="#D8527D" class="pulse"/>
  <text x="508" y="407" font-size="9" fill="#B93962">Predicted labels</text>
</g>

<!-- Connector -->
<path d="M646 315H668" stroke="#D8527D" stroke-width="2" class="flow"/>
<path d="M662 310L668 315L662 320" fill="none" stroke="#D8527D" stroke-width="1.5"/>

<!-- Stage 4: evaluation -->
<g class="float2">
  <rect x="670" y="211" width="190" height="205" rx="13" fill="#FFF9FB" stroke="#EFCAD7"/>
  <rect x="684" y="225" width="33" height="33" rx="9" fill="#F9E1E9"/>
  <g transform="translate(691 232)" fill="none" stroke="#9B123C" stroke-width="1.6">
    <rect width="20" height="20" rx="2"/>
    <path d="M0 10H20M10 0V20"/>
    <rect x="3" y="3" width="4" height="4" fill="#D8527D" stroke="none"/>
    <rect x="13" y="13" width="4" height="4" fill="#D8527D" stroke="none"/>
  </g>
  <text x="727" y="237" font-size="9" font-weight="bold" letter-spacing=".7" fill="#B93962">04 / EVALUATE</text>
  <text x="727" y="252" font-size="13" font-weight="bold" fill="#351321">Model Metrics</text>

  <rect x="684" y="275" width="162" height="73" rx="7" fill="#FFFFFF" stroke="#EED5DF"/>
  <text x="694" y="290" font-size="9" font-weight="bold" fill="#815365">CONFUSION MATRIX</text>
  <g transform="translate(713 298)">
    <rect width="37" height="18" rx="3" fill="#B93962"/>
    <rect x="41" width="37" height="18" rx="3" fill="#F9B3C9"/>
    <rect y="22" width="37" height="18" rx="3" fill="#F18AAA"/>
    <rect x="41" y="22" width="37" height="18" rx="3" fill="#D8527D"/>
    <g fill="#FFFFFF" font-size="9" font-weight="bold" text-anchor="middle">
      <text x="18" y="12">TP</text>
      <text x="59" y="12" fill="#7C2343">FP</text>
      <text x="18" y="34" fill="#7C2343">FN</text>
      <text x="59" y="34">TN</text>
    </g>
  </g>
  <text x="684" y="371" font-size="10" font-weight="bold" fill="#351321">Measure performance</text>
  <text x="684" y="390" font-size="10" fill="#815365">Accuracy • Precision • Recall</text>
  <circle cx="693" cy="403" r="3" fill="#D8527D" class="pulse"/>
  <text x="702" y="407" font-size="9" fill="#B93962">Evaluation results</text>
</g>

<!-- Right model summary -->
<rect x="905" y="149" width="300" height="315" rx="19" fill="#FFFFFF" stroke="#F0C9D6" filter="url(#shadow)"/>
<text x="929" y="179" font-size="10" font-weight="bold" letter-spacing="1.5" fill="#B93962">MODEL EVALUATION</text>
<text x="929" y="204" font-size="18" font-weight="bold" fill="#351321">Baseline performance</text>
<line x1="929" y1="217" x2="1181" y2="217" stroke="#F1DCE4"/>

<!-- Metric rows -->
<g>
  <text x="929" y="244" font-size="11" fill="#573042">Accuracy</text>
  <text x="1181" y="244" text-anchor="end" font-size="11" font-weight="bold" fill="#9B123C">Metric</text>
  <rect x="929" y="253" width="252" height="7" rx="3.5" fill="#F7E5EB"/>
  <rect x="929" y="253" width="176" height="7" rx="3.5" fill="url(#rose)" class="bar"/>

  <text x="929" y="285" font-size="11" fill="#573042">Precision</text>
  <text x="1181" y="285" text-anchor="end" font-size="11" font-weight="bold" fill="#9B123C">Metric</text>
  <rect x="929" y="294" width="252" height="7" rx="3.5" fill="#F7E5EB"/>
  <rect x="929" y="294" width="145" height="7" rx="3.5" fill="#D8527D" class="bar"/>

  <text x="929" y="326" font-size="11" fill="#573042">Recall</text>
  <text x="1181" y="326" text-anchor="end" font-size="11" font-weight="bold" fill="#9B123C">Metric</text>
  <rect x="929" y="335" width="252" height="7" rx="3.5" fill="#F7E5EB"/>
  <rect x="929" y="335" width="160" height="7" rx="3.5" fill="#F18AAA" class="bar"/>
</g>

<rect x="929" y="366" width="252" height="77" rx="10" fill="url(#rose)"/>
<text x="946" y="388" font-size="10" font-weight="bold" letter-spacing="1" fill="#FFE8EF">BASELINE MODEL</text>
<text x="946" y="409" font-size="14" font-weight="bold" fill="#FFFFFF">Performance benchmark</text>
<text x="946" y="428" font-size="10" fill="#FFE8EF">Compare future model improvements</text>

<!-- Footer -->
<line x1="65" y1="489" x2="1205" y2="489" stroke="#E9B7C8" opacity=".8"/>
<text x="65" y="514" font-size="10" font-weight="bold" letter-spacing="1.8" fill="#9B123C">BASELINE CLASSIFICATION</text>
<text x="635" y="514" text-anchor="middle" font-size="10" fill="#A8798A">SPLIT → TRAIN → PREDICT → EVALUATE</text>
<text x="1205" y="514" text-anchor="end" font-size="10" fill="#9B123C">PART C / 03</text>
</svg>
