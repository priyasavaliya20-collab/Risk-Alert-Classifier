          letter-spacing="-1.5">Risk Alert</text>

    <text x="78" y="251"
          fill="url(#accent)"
          font-size="48"
          font-weight="800"
          letter-spacing="-1.5">Classifier</text>

    <!-- ACCENT LINE -->
    <rect x="80" y="278" width="92" height="5" rx="2.5"
          fill="#F7A1BB">
      <animate attributeName="width"
               values="55;105;55" dur="3s"
               repeatCount="indefinite"/>
    </rect>

    <text x="80" y="321"
          fill="#FFFFFF" fill-opacity=".9"
          font-size="17">Detect risks. Classify alerts.</text>

    <text x="80" y="348"
          fill="#FFFFFF" fill-opacity=".9"
          font-size="17">Enable smarter decisions.</text>

    <!-- BOTTOM LABELS -->
    <rect x="80" y="388" width="125" height="35" rx="8"
          fill="#FFFFFF" fill-opacity=".11"
          stroke="#FFFFFF" stroke-opacity=".25"/>

    <text x="142.5" y="410" text-anchor="middle"
          fill="#FFFFFF" font-size="12"
          font-weight="700" letter-spacing="1">DETECTION</text>

    <rect x="216" y="388" width="120" height="35" rx="8"
          fill="#FFFFFF" fill-opacity=".11"
          stroke="#FFFFFF" stroke-opacity=".25"/>

    <text x="276" y="410" text-anchor="middle"
          fill="#FFFFFF" font-size="12"
          font-weight="700" letter-spacing="1">CLASSIFICATION</text>
  </g>

  <!-- RIGHT VISUAL PANEL -->
  <rect x="700" y="67" width="424" height="365" rx="24"
        fill="url(#panel)"
        stroke="#FFFFFF" stroke-opacity=".32"/>

  <!-- PANEL HEADER -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="732" y="103" fill="#FFFFFF"
          font-size="12" font-weight="700"
          letter-spacing="2">RISK INTELLIGENCE</text>

    <circle cx="1083" cy="98" r="5" fill="#F7A1BB">
      <animate attributeName="r"
               values="4;6;4" dur="1.6s"
               repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- RADAR RINGS -->
  <g transform="translate(910 246)">
    <circle r="112" fill="none"
            stroke="#FFFFFF" stroke-opacity=".13"/>
    <circle r="86" fill="none"
            stroke="#FFFFFF" stroke-opacity=".23"/>
    <circle r="59" fill="none"
            stroke="#FFFFFF" stroke-opacity=".32"/>
    <circle r="31" fill="#F7A1BB" fill-opacity=".14"
            stroke="#F7A1BB" stroke-opacity=".8"/>

    <path d="M-112 0H112 M0 -112V112"
          fill="none" stroke="#FFFFFF"
          stroke-opacity=".18" stroke-dasharray="4 6"/>

    <!-- SWEEP -->
    <path d="M0 0 L0 -108 A108 108 0 0 1 76 76 Z"
