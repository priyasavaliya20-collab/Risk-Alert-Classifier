               repeatCount="indefinite"/>
    </circle>

    <!-- RISK SIGNALS -->
    <circle cx="-58" cy="-48" r="6" fill="#F7A1BB">
      <animate attributeName="opacity"
               values="1;.25;1" dur="1.4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="64" cy="-29" r="5" fill="#FFFFFF">
      <animate attributeName="opacity"
